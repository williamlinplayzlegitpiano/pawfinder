name: User Story
description: Create a new feature or user-focused task
title: "[USER STORY] "
labels:
  - user story
body:
  - type: markdown
    attributes:
      value: |
        Use this template to describe a feature from the user's perspective.

  - type: textarea
    id: user-story
    attributes:
      label: User Story
      description: Describe who the user is, what they want, and why.
      placeholder: As a user, I want to... so that...
    validations:
      required: true

  - type: textarea
    id: requirements
    attributes:
      label: Requirements
      description: List the main requirements for this feature.
      placeholder: |
        - Requirement 1
        - Requirement 2
        - Requirement 3
    validations:
      required: true

  - type: textarea
    id: acceptance-criteria
    attributes:
      label: Acceptance Criteria
      description: Describe what must be completed for this story to be considered done.
      placeholder: |
        - [ ] The user can...
        - [ ] The screen displays...
        - [ ] Errors are handled...
    validations:
      required: true

  - type: textarea
    id: testing
    attributes:
      label: Testing
      description: Explain how this feature should be tested.
      placeholder: |
        - Test on Android emulator
        - Confirm buttons work correctly
        - Confirm the layout displays correctly
    validations:
      required: true

  - type: input
    id: design-reference
    attributes:
      label: Design Reference
      description: Add a Figma link, screenshot, or other design reference.
      placeholder: https://www.figma.com/...

  - type: dropdown
    id: estimate
    attributes:
      label: Estimate
      description: Estimate the amount of work using story points.
      options:
        - 1 point
        - 2 points
        - 3 points
        - 5 points
        - 8 points
        - Needs discussion
    validations:
      required: true

  - type: dropdown
    id: priority
    attributes:
      label: Priority
      options:
        - Low
        - Medium
        - High
        - Critical
    validations:
      required: true
